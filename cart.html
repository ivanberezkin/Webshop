<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <title>Cart</title>
  </head>
  <body>
    <div id="navbar"></div>

    <div class="container py-5">
      <h1 class="text-center my-5">My Cart</h1>
      <div class="row">
        <div class="col-12 col-sm-12 col-lg-9">
          <div id="cart-container" class="mb-5"></div>
        </div>
        <div class="col-12 col-sm-12 col-md-3 col-lg-3">
          <div class="card order-summary-card shadow-sm">
            <div class="card-body">
              <h5 class="card-title mb-4">Cart Summary</h5>
              <p class="card-text d-flex justify-content-between mb-3">
                Total items:
                <span id="cart-item-count" class="fw-bold">0</span>
              </p>
              <p class="card-text d-flex justify-content-between mb-3">
                Total price:
                <span id="cart-total-price" class="fw-bold">0.00$</span>
              </p>
              <button id="checkout-button" class="btn btn-primary w-100">
                Checkout
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="navbarCreater.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="fetchCart.js"></script>
  </body>
</html>
